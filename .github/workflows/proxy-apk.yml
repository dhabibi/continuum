name: Proxy APK

on:
  workflow_dispatch:
  push:
    branches: [vps-proxy]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/proxy-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch bundled subreddit lists
        run: |
          git init ../subreddit-lists
          git -C ../subreddit-lists fetch --depth=1 https://github.com/cygnusx-1-org/subreddit-lists.git 8915d331f98ed653f7e4feb2b2769651286e8980
          git -C ../subreddit-lists checkout --detach FETCH_HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build installable debug APKs
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify APK signatures
        run: |
          for apk in app/build/outputs/apk/debug/*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: continuum-vps-proxy
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
